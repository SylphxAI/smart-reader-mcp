name: Deprecate retired Prism npm id

# Mark @sylphx/smart-reader-mcp as retired product (not install CTA).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPRECATE_SMART_READER_MCP
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    if: ${{ inputs.confirm == 'DEPRECATE_SMART_READER_MCP' }}
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - name: npm deprecate retired Prism package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${NODE_AUTH_TOKEN:-$NPM_TOKEN}"
          test -n "$TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$TOKEN" > "$HOME/.npmrc"
          export NPM_CONFIG_USERCONFIG="$HOME/.npmrc"
          npm whoami
          MSG='RETIRED product (Prism). Do not install. Host composition: @sylphx/citra + @sylphx/iris + @sylphx/cue. See SylphxAI/smart-reader-mcp README.'
          npm deprecate "@sylphx/smart-reader-mcp" "$MSG" || true
          # brand dual-publish id if it ever existed
          if npm view @sylphx/prism version >/dev/null 2>&1; then
            npm deprecate "@sylphx/prism" "$MSG" || true
          fi
          npm view @sylphx/smart-reader-mcp version deprecated dist-tags || true
