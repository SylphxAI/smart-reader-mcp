name: native-multiarch

# RETIRED product (Prism / smart-reader-mcp). No further public publishes.
# Host owns composition of Citra/Iris/Cue. See README.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RETIRED (workflow intentionally fails closed)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: sylphx-linux-standard
    steps:
      - name: Prism product publish retired
        run: |
          set -euo pipefail
          echo "::error::native-multiarch is retired. Prism is not an Instrument product."
          echo "Use @sylphx/citra, @sylphx/iris, @sylphx/cue via host composition."
          exit 1
