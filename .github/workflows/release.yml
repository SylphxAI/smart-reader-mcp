name: Release

# RETIRED product — no release publishes. Keep workflow for history/visibility only.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RETIRED'
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: sylphx-linux-standard
    steps:
      - name: Prism release train retired
        run: |
          set -euo pipefail
          echo "::error::Prism/smart-reader-mcp release train is retired."
          exit 1
