name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RELEASE
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: ${{ inputs.confirm == 'RELEASE' }}
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - name: Enforce owned CI runner profiles
        run: python3 .github/scripts/check-owned-runner-profiles.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: bun run check
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      - run: bun run benchmark:release-gate

  publish-npm:
    needs: validate
    if: ${{ inputs.confirm == 'RELEASE' }}
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          always-auth: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish transitional + brand
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${NODE_AUTH_TOKEN:-$NPM_TOKEN}"
          test -n "$TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$TOKEN" > "$HOME/.npmrc"
          export NPM_CONFIG_USERCONFIG="$HOME/.npmrc"
          unset npm_config_workspace || true
          VER=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo already "$NAME@$VER"
          else
            npm publish --access public
            for i in $(seq 1 24); do npm view "$NAME@$VER" version >/dev/null 2>&1 && break; sleep 5; done
          fi
          npm view "$NAME@$VER" version
          # brand alias @sylphx/prism
          if npm view "@sylphx/prism@$VER" version >/dev/null 2>&1; then
            echo already brand
          else
            WORK=$(mktemp -d)
            cd "$WORK"
            npm pack "$NAME@$VER"
            tar -xzf *.tgz
            cd package
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@sylphx/prism';const b=p.bin&&(p.bin['smart-reader-mcp']||Object.values(p.bin||{})[0]);p.bin={prism:b,'smart-reader-mcp':b};delete p.scripts;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
            npm publish --access public --ignore-scripts
          fi
          npm view @sylphx/prism@$VER version bin
